# GitHub Actions 自动构建和发布

name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 以 v 开头的标签触发发布

jobs:
  build:
    name: Build Release
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: VoiceChanger-windows.zip
          - os: macos-latest
            artifact: VoiceChanger-macos.zip
          - os: ubuntu-latest
            artifact: VoiceChanger-linux.zip
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build executable
        run: |
          pyinstaller voice-changer.spec --clean
      
      - name: Package release
        run: |
          cd dist
          zip -r ${{ matrix.artifact }} VoiceChanger/
          mv ${{ matrix.artifact }} ../
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
  
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
