# 配置文件示例
# =====================================

[paths]
# 模型目录
models_dir = models

# 特征目录
features_dir = features

# 检查点目录
checkpoints_dir = checkpoints

# 数据集目录
datasets_dir = datasets


[audio]
# 采样率
sample_rate = 48000

# 声道数
channels = 1

# 缓冲区大小
buffer_size = 512

# 输出目标采样率
target_sample_rate = 22050


[training]
# 批次大小
batch_size = 16

# 学习率
learning_rate = 0.0001

# 训练轮数
num_epochs = 100

# 保存间隔
save_every = 10

# 并行进程数
num_workers = 4

# 混合精度训练
mixed_precision = false


[model]
# 模型名称
name = my_voice

# RVC 版本
version = v2

# 使用 HuBERT 特征
use_hubert = true

# 音高提取方法 (pm, harvest, crepe)
f0_method = pm


[devices]
# 音频输入设备索引
input_device = -1

# 音频输出设备索引
output_device = -1

# 虚拟声卡设备索引
virtual_device = -1


[inference]
# 音调偏移
pitch_shift = 0

# 音量增益
volume_gain = 1.0

# 延迟优化模式 (low_latency, quality, balanced)
optimization = balanced


[ui]
# 界面主题 (dark, light, system)
theme = dark

# 刷新率 (ms)
refresh_rate = 100

# 显示实时波形
show_waveform = true

# 音量表更新间隔
volume_update_interval = 50
